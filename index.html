<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Saya</title>
  
  <!-- File Manifest & Tema PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4285f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <iframe src="https://script.google.com/macros/s/AKfycbygPPEviq1E-j-lLz4NkeP22FOjBnk36owttNNHJp_Icnc___Xj1WZtbf-RtD02yToP3A/exec"></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker Terdaftar'))
        .catch(err => console.log('Service Worker Gagal:', err));
    }
  </script>
</body>
</html>
